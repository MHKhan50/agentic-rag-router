[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-router"
version = "0.2.0"
description = "Cost-aware neural routing of queries to specialist RAG agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muzammal Hussain" }]
dependencies = [
  "torch>=2.1",
  "transformers>=4.43",
  "accelerate>=0.27",
  "datasets>=2.18",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
